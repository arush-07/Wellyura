[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellyura-api"
version = "4.0.0"
description = "Wellyura modular FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35.0,<0.36.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.40,<3.0.0",
  "asyncpg>=0.30.0,<0.31.0",
  "alembic>=1.16.0,<2.0.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "httpx>=0.28.0,<0.29.0",
  "orjson>=3.10.0,<4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "ruff>=0.12.0,<0.13.0",
  "mypy>=1.16.0,<2.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
